[server]
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = true
enableWebsocketCompression = true

[theme]
primaryColor = "#315D8A"
backgroundColor = "#E9EDF1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#243247"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
showSidebarNavigation = true

[runner]
magicEnabled = false
